name: Build and Host TIC-80 Game

on:
  push:
    branches:
      - main # Or your default branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-2.0-0 \
            libgl1 \
            libglx-mesa0 \
            libgl1-mesa-dri \
            xvfb \
            curl

      - name: Download TIC-80
        run: |
          # Automatically fetch the latest linux release from nesbox/TIC-80 repository
          RELEASE_URL=$(curl -s https://api.github.com/repos/nesbox/TIC-80/releases/latest | grep "browser_download_url.*linux.tar.gz" | cut -d '"' -f 4)
          curl -L -o tic80.tar.gz "$RELEASE_URL"
          tar -xvf tic80.tar.gz
          
          # Ensure executable permissions are granted wherever extracted
          find . -name "tic80" -type f -exec chmod +x {} \;
          
          # Move binary to local directory root if embedded in subfolders
          find . -name "tic80" -type f -exec mv {} ./tic80 \;

      - name: Compile Cartridge to HTML
        run: |
          mkdir -p dist
          # Run wrapped in xvfb for virtual display rendering
          xvfb-run --auto-servernum ./tic80 --cli --cmd "load sandbox_game.tic & export html distalone=1 & exit"
          
          # Move compiled output into place for deployment
          mv dist/game.html dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
