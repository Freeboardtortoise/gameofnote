name: Build, Host, and Release TIC-80 Game

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-2.0-0 \
            libgl1 \
            libglx-mesa0 \
            libgl1-mesa-dri \
            xvfb \
            curl

      - name: Download and Install TIC-80
        run: |
          RELEASE_URL=$(curl -s https://api.github.com/repos/nesbox/TIC-80/releases/latest | grep "browser_download_url.*linux.deb" | cut -d '"' -f 4)
          curl -L -o tic80.deb "$RELEASE_URL"
          sudo dpkg -i tic80.deb || sudo apt-get install -f -y

      - name: Compile Game Builds
        run: |
          mkdir -p dist/downloads
          
          # 1. Export Web/HTML version
          SDL_AUDIODRIVER=dummy xvfb-run --auto-servernum tic80 --cli --soft --fs=. --cmd "load sandbox_game.tic & import code code.py & export html standalone=1 & exit" < /dev/null
          unzip standalone.zip -d dist

          # 2. Export Native builds separately (TIC-80's CLI parser expects individual export commands)
          SDL_AUDIODRIVER=dummy xvfb-run --auto-servernum tic80 --cli --soft --fs=. --cmd "load sandbox_game.tic & import code code.py & export win game.exe & exit" < /dev/null
          zip dist/downloads/game-windows.zip game.exe

          SDL_AUDIODRIVER=dummy xvfb-run --auto-servernum tic80 --cli --soft --fs=. --cmd "load sandbox_game.py & import code code.py & export linux game-linux & exit" < /dev/null || \
          SDL_AUDIODRIVER=dummy xvfb-run --auto-servernum tic80 --cli --soft --fs=. --cmd "load sandbox_game.tic & import code code.py & export linux game-linux & exit" < /dev/null
          zip dist/downloads/game-linux.zip game-linux

          SDL_AUDIODRIVER=dummy xvfb-run --auto-servernum tic80 --cli --soft --fs=. --cmd "load sandbox_game.tic & import code code.py & export mac game-mac & exit" < /dev/null
          zip dist/downloads/game-mac.zip game-mac

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/downloads/game-windows.zip
            dist/downloads/game-linux.zip
            dist/downloads/game-mac.zip
          generate_release_notes: true
