name: Build and Host TIC-80 Game

on:
  push:
    branches:
      - main # Or your default branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-2.0-0 \
            libgl1 \
            libglx-mesa0 \
            libgl1-mesa-dri \
            xvfb \
            curl

      - name: Download and Install TIC-80
        run: |
          # Fetch the latest .deb release package from GitHub API
          RELEASE_URL=$(curl -s https://api.github.com/repos/nesbox/TIC-80/releases/latest | grep "browser_download_url.*linux.deb" | cut -d '"' -f 4)
          
          # Download and install via dpkg
          curl -L -o tic80.deb "$RELEASE_URL"
          sudo dpkg -i tic80.deb || sudo apt-get install -f -y

      - name: Compile Cartridge to HTML
        run: |
          mkdir -p dist
          # Run tic80 globally wrapped in xvfb
          xvfb-run --auto-servernum tic80 --cli --cmd "load game.tic & export html distalone=1 & exit"
          
          # Move compiled output into place for deployment
          mv dist/game.html dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
